{% set name = "catalystcoop.ferc_xbrl_extractor" %}
{% set version = "1.11.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/70/3a/fb6b6c08268c89eb6bf4365265e4306bc1c7fb989be69ed3eac9ece54cce/catalystcoop_ferc_xbrl_extractor-{{ version }}.tar.gz
  sha256: 4940c4ee7d40ff51f7ea5f790932c80e4e614e6933d39109504addd5cbeaaa02

build:
  entry_points:
    - xbrl_extract = ferc_xbrl_extractor.cli:main
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - hatch-vcs
    - pip
  run:
    - python >={{ python_min }}
    - arelle-release >=2.32
    - coloredlogs >=14.0
    - python-duckdb >=1.3.2
    - frictionless >=5,<6
    - lxml >=4.9.1
    - numpy >=1.16,<3
    - pandas >=1.5
    - pyarrow >=14.0.1
    - pydantic >=2,<3
    - sqlalchemy >=1.4,<3
    - stringcase >=1.2

test:
  imports:
    - ferc_xbrl_extractor
  commands:
    - pip check
    - xbrl_extract --help
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/catalyst-cooperative/ferc-xbrl-extractor
  summary: A tool for extracting data from FERC XBRL regulatory filings into SQLite databases.
  dev_url: https://github.com/catalyst-cooperative/ferc-xbrl-extractor
  doc_url: https://catalystcoop-ferc-xbrl-extractor.readthedocs.io/en/latest/
  license: MIT
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - zschira
    - zaneselvans
    - jdangerx
    - cmgosnell
